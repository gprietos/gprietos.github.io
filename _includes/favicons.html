<!--
  Site favicon: reuses `site.avatar` (the same GitHub profile picture shown
  in the sidebar) instead of the theme's generated favicon set, requesting
  it at a few pixel sizes via GitHub's own avatar resizing query param.
-->

<link rel="icon" type="image/png" sizes="96x96" href="{{ site.avatar }}&s=96">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.avatar }}&s=32">
<link rel="shortcut icon" href="{{ site.avatar }}&s=32">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.avatar }}&s=180">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">
{% endif %}
